<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="500">
  <defs>
    <linearGradient id="whiskyGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1C02"/>
      <stop offset="35%" stop-color="#9C5208"/>
      <stop offset="65%" stop-color="#D98A18"/>
      <stop offset="100%" stop-color="#2D1501"/>
    </linearGradient>
    <linearGradient id="whiskyLabelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5EBE0"/>
      <stop offset="100%" stop-color="#E3D1B8"/>
    </linearGradient>
    <linearGradient id="copperCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#5C2E0B"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="460" rx="85" ry="20" fill="rgba(0,0,0,0.6)"/>

  <!-- Heavy Square Whisky Bottle -->
  <path d="M 132,40 L 168,40 L 168,130 L 202,155 L 202,435 C 202,448 192,452 178,452 L 122,452 C 108,452 98,448 98,435 L 98,155 L 132,130 Z" fill="url(#whiskyGold)" stroke="#CD7F32" stroke-width="1.5"/>

  <!-- Heavy Wooden/Copper Cork Cap -->
  <rect x="128" y="28" width="44" height="28" rx="3" fill="url(#copperCap)"/>
  <rect x="125" y="56" width="50" height="6" fill="#1C1618"/>

  <!-- Label (Highland Single Malt 18 Years) -->
  <g transform="translate(104, 210)">
    <rect x="0" y="0" width="92" height="175" rx="3" fill="url(#whiskyLabelGrad)" stroke="#8B4513" stroke-width="2"/>
    <rect x="4" y="4" width="84" height="167" rx="2" fill="none" stroke="#CD7F32" stroke-width="1"/>

    <!-- Scottish Thistle / Crest Icon -->
    <path d="M 46,18 C 40,10 52,10 46,18 Z" fill="#8B4513"/>
    <circle cx="46" cy="24" r="4" fill="#CD7F32"/>

    <text x="46" y="50" font-family="'Cinzel', serif" font-size="10" font-weight="bold" fill="#2D1501" text-anchor="middle">HIGHLAND</text>
    <text x="46" y="63" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#8B4513" text-anchor="middle">SINGLE MALT</text>
    <text x="46" y="75" font-family="serif" font-size="7" font-style="italic" fill="#555" text-anchor="middle">SCOTCH WHISKY</text>
    
    <rect x="16" y="85" width="60" height="22" rx="2" fill="#2D1501"/>
    <text x="46" y="100" font-family="'Cinzel', serif" font-size="10" font-weight="bold" fill="#FFD700" text-anchor="middle">AGED 18 YEARS</text>

    <text x="46" y="125" font-family="serif" font-size="7" fill="#8B4513" text-anchor="middle">DISTILLED IN SCOTLAND</text>
    <text x="46" y="138" font-family="serif" font-size="6" fill="#555" text-anchor="middle">NATURAL CASK STRENGTH</text>
    <text x="46" y="156" font-family="sans-serif" font-size="5.5" fill="#2D1501" text-anchor="middle">70 CL • 43% ALC./VOL.</text>
  </g>
</svg>
