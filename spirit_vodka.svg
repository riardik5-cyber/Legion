<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="500">
  <defs>
    <linearGradient id="crystalVodka" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8C8E8"/>
      <stop offset="30%" stop-color="#EBF5FF"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7DA0C4"/>
    </linearGradient>
    <linearGradient id="silverCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="50%" stop-color="#FFF"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="460" rx="75" ry="18" fill="rgba(0,0,0,0.4)"/>

  <!-- Bottle Body -->
  <path d="M 136,40 L 164,40 L 164,140 C 164,170 192,185 192,230 L 192,435 C 192,448 182,452 168,452 L 132,452 C 118,452 108,448 108,435 L 108,230 C 108,185 136,170 136,140 Z" fill="url(#crystalVodka)" opacity="0.9" stroke="#A8C8E8" stroke-width="1.5"/>

  <!-- Silver Cap -->
  <rect x="134" y="30" width="32" height="35" rx="3" fill="url(#silverCap)"/>
  <rect x="132" y="65" width="36" height="5" fill="#1E3A5F"/>

  <!-- Label (Pure Imperial Crystal Vodka) -->
  <g transform="translate(112, 220)">
    <rect x="0" y="0" width="76" height="170" rx="3" fill="#0A1828" opacity="0.85" stroke="#A8C8E8" stroke-width="1.5"/>
    <rect x="4" y="4" width="68" height="162" fill="none" stroke="#FFF" stroke-width="0.8" opacity="0.5"/>

    <!-- Double-headed Imperial Eagle outline -->
    <path d="M 38,20 L 45,28 L 38,32 L 31,28 Z" fill="#FFF"/>

    <text x="38" y="55" font-family="'Cinzel', serif" font-size="9" font-weight="bold" fill="#FFF" text-anchor="middle">IMPERIAL</text>
    <text x="38" y="68" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#7DA0C4" text-anchor="middle">VODKA</text>
    
    <text x="38" y="85" font-family="serif" font-size="7" font-style="italic" fill="#DDD" text-anchor="middle">LUX FILTERED</text>
    <line x1="15" y1="95" x2="61" y2="95" stroke="#7DA0C4" stroke-width="1"/>

    <text x="38" y="115" font-family="sans-serif" font-size="6" fill="#FFF" text-anchor="middle">ALPHA SPIRIT</text>
    <text x="38" y="130" font-family="serif" font-size="6" fill="#AAA" text-anchor="middle">40% ALC / VOL</text>
    <text x="38" y="148" font-family="sans-serif" font-size="5" fill="#7DA0C4" text-anchor="middle">0.7 LITER</text>
  </g>
</svg>
