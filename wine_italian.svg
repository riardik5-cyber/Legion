<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="500">
  <defs>
    <linearGradient id="glassIt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F1A0A"/>
      <stop offset="35%" stop-color="#2D4A1D"/>
      <stop offset="70%" stop-color="#192C10"/>
      <stop offset="100%" stop-color="#080F05"/>
    </linearGradient>
    <linearGradient id="goldCapIt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>
    <radialGradient id="shadowIt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="150" cy="460" rx="90" ry="20" fill="url(#shadowIt)"/>

  <!-- Bottle Body -->
  <path d="M 132,40 L 168,40 L 168,110 C 168,155 208,175 208,235 L 208,430 C 208,445 198,450 180,450 L 120,450 C 102,450 92,445 92,430 L 92,235 C 92,175 132,155 132,110 Z" fill="url(#glassIt)"/>

  <!-- Neck Seal -->
  <rect x="130" y="35" width="40" height="30" fill="url(#goldCapIt)" rx="2"/>
  <rect x="127" y="65" width="46" height="6" fill="#8B0000" rx="2"/>

  <!-- Label (Chianti Style) -->
  <g transform="translate(102, 220)">
    <rect x="0" y="0" width="96" height="160" rx="4" fill="#FAF3E0" stroke="#B8860B" stroke-width="2"/>
    <rect x="5" y="5" width="86" height="150" rx="2" fill="none" stroke="#2D4A1D" stroke-width="1"/>

    <!-- Black Rooster emblem (Chianti Classico) -->
    <path d="M 48,22 C 43,15 40,25 43,30 C 40,35 48,45 48,40 C 52,45 55,30 48,22 Z" fill="#1C1618"/>
    <circle cx="48" cy="20" r="2" fill="#8B0000"/>

    <text x="48" y="60" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#192C10" text-anchor="middle">CHIANTI</text>
    <text x="48" y="73" font-family="serif" font-size="7" fill="#8B6508" text-anchor="middle">CLASSICO RISERVA</text>

    <!-- Italian Flag Ribbon -->
    <rect x="23" y="85" width="16" height="4" fill="#009246"/>
    <rect x="39" y="85" width="18" height="4" fill="#FFFFFF"/>
    <rect x="57" y="85" width="16" height="4" fill="#CE2B37"/>

    <text x="48" y="108" font-family="'Cinzel', serif" font-size="8" fill="#192C10" text-anchor="middle">ITALIA</text>
    <text x="48" y="122" font-family="serif" font-size="6" font-style="italic" fill="#555" text-anchor="middle">DOCG 2018</text>
    <text x="48" y="142" font-family="sans-serif" font-size="5" fill="#888" text-anchor="middle">750ml e • 14% vol</text>
  </g>
</svg>
